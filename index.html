<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ukulele-Trainer</title>
<style>
:root{--bg:#faf9f5;--card:#ffffff;--text:#1f1e1d;--muted:#6b6a65;--line:#d9d6cc;--accent:#0F6E56;--accentbg:#E1F5EE;--accentText:#085041;--open:#534AB7;--openbg:#EEEDFE;--openText:#3C3489;--ok:#3B6D11;--okbg:#EAF3DE;--okText:#27500A;--bad:#A32D2D;--badbg:#FCEBEB;--badText:#791F1F;--sharp:#F1EFE8;--sharpText:#5F5E5A}
@media (prefers-color-scheme:dark){:root{--bg:#1f1e1d;--card:#2a2927;--text:#f1efe8;--muted:#b4b2a9;--line:#4a4945;--accent:#5DCAA5;--accentbg:#04342C;--accentText:#9FE1CB;--open:#AFA9EC;--openbg:#26215C;--openText:#CECBF6;--ok:#97C459;--okbg:#173404;--okText:#C0DD97;--bad:#F09595;--badbg:#501313;--badText:#F7C1C1;--sharp:#2C2C2A;--sharpText:#B4B2A9}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:system-ui,-apple-system,"Segoe UI",sans-serif;font-size:16px;line-height:1.5}
#root{max-width:480px;margin:0 auto;padding:16px 16px 40px}
h1{font-size:22px;font-weight:500;margin:0}
.sub{color:var(--muted);font-size:14px;margin:0 0 12px}
.tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:0 0 12px}
button,select{font:inherit;color:var(--text)}
.tab{padding:8px 4px;border:0.5px solid var(--line);background:var(--card);border-radius:8px;font-size:14px;cursor:pointer}
.tab.on{background:var(--accentbg);border-color:var(--accent);color:var(--accentText);font-weight:500}
.ctl{display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center;margin:0 0 12px;font-size:14px;color:var(--muted)}
.ctl label{display:flex;align-items:center;gap:6px}
select{padding:6px 8px;border:0.5px solid var(--line);border-radius:8px;background:var(--card)}
.card{background:var(--card);border:0.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 12px}
.prompt{font-size:20px;font-weight:500;margin:0}
.fb{margin:6px 0 0;font-size:15px;min-height:22px}
.fb.ok{color:var(--ok)}.fb.bad{color:var(--bad)}
.btn{padding:10px 16px;border:0.5px solid var(--line);background:var(--card);border-radius:8px;cursor:pointer;font-size:15px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--bg);font-weight:500}
.score{display:flex;gap:16px;font-size:14px;color:var(--muted);margin:0 0 8px}
.score b{color:var(--text);font-weight:500}
.ans{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:0 0 12px}
.ans .btn{padding:12px 0;font-size:17px}
.ans .btn.ok{background:var(--okbg);border-color:var(--ok);color:var(--okText)}
.ans .btn.bad{background:var(--badbg);border-color:var(--bad);color:var(--badText)}
svg.fb-svg{width:100%;height:auto;display:block;touch-action:manipulation}
.nat circle{fill:var(--accentbg);stroke:var(--accent)}.nat text{fill:var(--accentText)}
.sharp circle{fill:var(--sharp);stroke:var(--line)}.sharp text{fill:var(--sharpText)}
.open circle,.q circle{fill:var(--openbg);stroke:var(--open)}.open text,.q text{fill:var(--openText)}
.ok circle{fill:var(--okbg);stroke:var(--ok)}.ok text{fill:var(--okText)}
.bad circle{fill:var(--badbg);stroke:var(--bad)}.bad text{fill:var(--badText)}
.dot circle{stroke-width:1}.dot text{font-size:14px;font-weight:500;text-anchor:middle;dominant-baseline:central}
.hit{fill:transparent;cursor:pointer}
.bar{height:8px;border-radius:4px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent)}
.row{display:grid;grid-template-columns:34px 1fr 64px;gap:10px;align-items:center;margin:6px 0;font-size:14px}
.row span:last-child{text-align:right;color:var(--muted)}
.big{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin:0 0 12px}
.big div{background:var(--card);border:0.5px solid var(--line);border-radius:8px;padding:10px 12px}
.big small{display:block;color:var(--muted);font-size:13px}
.big strong{font-size:22px;font-weight:500}
.hint{font-size:13px;color:var(--muted)}
.meter{position:relative;height:8px;border-radius:4px;background:var(--line);margin:12px 0 4px}
.meter span{position:absolute;left:50%;top:-3px;width:2px;height:14px;background:var(--muted)}
.meter i{position:absolute;top:-2px;left:50%;width:10px;height:12px;margin-left:-5px;border-radius:3px;background:var(--accent);z-index:1}
</style>
</head>
<body>
<div id="root"></div>
<script>
var NOTES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','H'];
var STR=[{n:'G',pc:7,f:392.0,m:67},{n:'C',pc:0,f:261.63,m:60},{n:'E',pc:4,f:329.63,m:64},{n:'A',pc:9,f:440.0,m:69}];
function octName(m){return NOTES[((m%12)+12)%12]+(Math.floor(m/12)-1);}
var XS=[80,140,200,260], TOP=66, FH=44;
var KEY='ukulele-trainer-v1';
function noteAt(s,f){return (STR[s].pc+f)%12;}
function isNat(n){return NOTES[n].indexOf('#')<0;}

var stats={total:0,correct:0,best:0,notes:{}};
try{var raw=localStorage.getItem(KEY);if(raw){var p=JSON.parse(raw);if(p&&p.notes)stats=p;}}catch(e){}
function save(){try{localStorage.setItem(KEY,JSON.stringify(stats));}catch(e){}}

var state={mode:'map',maxFret:5,sharps:false,sound:true,streak:0,q:null,last:null,resetArmed:false,mic:{on:false,err:'',stable:0,cool:0}};
var micH={stream:null,ctx:null,an:null,buf:null,timer:null};

function detect(buf,sr){
  var n=buf.length,i,rms=0;
  for(i=0;i<n;i++)rms+=buf[i]*buf[i];
  rms=Math.sqrt(rms/n);
  if(rms<0.012)return null;
  var minLag=Math.floor(sr/1100),maxLag=Math.min(Math.floor(sr/200),n-2),nsdf=[],tau;
  for(tau=minLag-1;tau<=maxLag+1;tau++){
    var acf=0,m=0;
    for(i=0;i<n-tau;i++){acf+=buf[i]*buf[i+tau];m+=buf[i]*buf[i]+buf[i+tau]*buf[i+tau];}
    nsdf[tau]=m>0?2*acf/m:0;
  }
  var peaks=[],mx=0;
  for(tau=minLag;tau<=maxLag;tau++){
    if(nsdf[tau]>0&&nsdf[tau]>nsdf[tau-1]&&nsdf[tau]>=nsdf[tau+1]){peaks.push(tau);if(nsdf[tau]>mx)mx=nsdf[tau];}
  }
  if(mx<0.8)return null;
  for(i=0;i<peaks.length;i++){
    if(nsdf[peaks[i]]>=0.9*mx){
      var t=peaks[i],y0=nsdf[t-1],y1=nsdf[t],y2=nsdf[t+1],d=y0-2*y1+y2;
      var delta=d!==0?0.5*(y0-y2)/d:0;
      return sr/(t+delta);
    }
  }
  return null;
}

function stopMic(){
  if(micH.timer)clearInterval(micH.timer);
  micH.timer=null;
  if(micH.stream)micH.stream.getTracks().forEach(function(t){t.stop();});
  try{if(micH.ctx)micH.ctx.close();}catch(e){}
  micH.stream=null;micH.ctx=null;micH.an=null;
  state.mic.on=false;state.mic.stable=0;
}
function startMic(){
  state.mic.err='';
  var AC=window.AudioContext||window.webkitAudioContext;
  if(!navigator.mediaDevices||!navigator.mediaDevices.getUserMedia||!AC){
    state.mic.err='Dieser Browser bietet hier keinen Mikrofon-Zugriff. Öffne die Seite in einem eigenen Browser-Tab.';
    render();return;
  }
  var ctx=new AC();
  try{ctx.resume();}catch(e){}
  navigator.mediaDevices.getUserMedia({audio:{echoCancellation:false,noiseSuppression:false,autoGainControl:false}}).then(function(stream){
    micH.stream=stream;micH.ctx=ctx;
    var src=ctx.createMediaStreamSource(stream),an=ctx.createAnalyser();
    an.fftSize=2048;src.connect(an);
    micH.an=an;micH.buf=new Float32Array(an.fftSize);
    state.mic.on=true;state.mic.stable=0;state.mic.cool=Date.now()+500;
    micH.timer=setInterval(micTick,60);
    render();
  }).catch(function(err){
    try{ctx.close();}catch(e){}
    state.mic.err=(err&&err.name==='NotAllowedError')
      ?'Mikrofon-Zugriff blockiert. In der eingebetteten Ansicht ist das oft gesperrt. Öffne die Seite in einem eigenen Browser-Tab oder erlaube das Mikrofon in den Browser-Einstellungen.'
      :'Mikrofon nicht verfügbar. Prüfe, ob ein Mikrofon angeschlossen ist.';
    render();
  });
}
function micTick(){
  var m=state.mic;
  if(!micH.an)return;
  micH.an.getFloatTimeDomainData(micH.buf);
  var f=detect(micH.buf,micH.ctx.sampleRate);
  var liveEl=document.getElementById('live'),mk=document.getElementById('mk');
  if(!f){m.stable=0;if(liveEl)liveEl.textContent='–';return;}
  var mf=69+12*Math.log2(f/440),mi=Math.round(mf),cents=Math.round((mf-mi)*100);
  if(liveEl)liveEl.textContent=octName(mi)+' ('+(cents>0?'+':'')+cents+' ct)';
  if(mk)mk.style.left=(50+cents)+'%';
  var q=state.q;
  if(state.mode!=='find'||!q||q.done||Date.now()<m.cool)return;
  if(mi===STR[q.s].m+q.f)m.stable++;else m.stable=0;
  if(m.stable>=5){
    q.done=true;q.ok=true;q.picked={s:q.s,f:q.f};
    record(q.n,true);m.stable=0;render();
    var id=q.id;
    setTimeout(function(){if(state.q&&state.q.id===id&&state.mode==='find')next();},1200);
  }
}

var ac=null;
function play(s,f){
  if(!state.sound||state.mic.on)return;
  try{
    ac=ac||new (window.AudioContext||window.webkitAudioContext)();
    if(ac.state==='suspended')ac.resume();
    var o=ac.createOscillator(),g=ac.createGain(),t=ac.currentTime;
    o.type='triangle';o.frequency.value=STR[s].f*Math.pow(2,f/12);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.35,t+0.01);
    g.gain.exponentialRampToValueAtTime(0.0001,t+1.2);
    o.connect(g);g.connect(ac.destination);o.start(t);o.stop(t+1.3);
  }catch(e){}
}

function pool(){
  var r=[];
  for(var s=0;s<4;s++)for(var f=0;f<=state.maxFret;f++){
    var n=noteAt(s,f);
    if(state.sharps||isNat(n))r.push({s:s,f:f,n:n});
  }
  return r;
}
function weight(n){
  var st=stats.notes[n];
  if(!st||st.a<2)return 2;
  return 1+2*(1-st.c/st.a);
}
function newQ(){
  var p=pool(),tot=0,i;
  for(i=0;i<p.length;i++){
    var L=state.last;
    var same=L&&((L.s===p[i].s&&L.f===p[i].f)||(state.mic.on&&L.n===p[i].n));
    p[i].w=same?0:weight(p[i].n);
    tot+=p[i].w;
  }
  var x=Math.random()*tot,pick=p[0];
  for(i=0;i<p.length;i++){x-=p[i].w;if(x<=0&&p[i].w>0){pick=p[i];break;}}
  state.last={s:pick.s,f:pick.f,n:pick.n};
  state.q={s:pick.s,f:pick.f,n:pick.n,done:false,ok:false,picked:null,id:Date.now()};
}
function record(n,ok){
  var st=stats.notes[n]||(stats.notes[n]={a:0,c:0});
  st.a++;stats.total++;
  if(ok){st.c++;stats.correct++;state.streak++;if(state.streak>stats.best)stats.best=state.streak;}
  else state.streak=0;
  save();
}

function dotSvg(s,f,cls,label){
  var cx=XS[s],cy=f===0?40:TOP+FH*(f-0.5);
  return '<g class="dot '+cls+'"><circle cx="'+cx+'" cy="'+cy+'" r="17"/><text x="'+cx+'" y="'+cy+'">'+label+'</text></g>';
}
function fretboard(dots,band){
  var N=state.maxFret,H=TOP+FH*N+14,o='',i;
  o+='<svg class="fb-svg" viewBox="0 0 320 '+H+'" role="img" aria-label="Ukulele-Griffbrett">';
  o+='<rect x="52" y="'+TOP+'" width="236" height="'+(FH*N)+'" rx="2" fill="var(--card)" stroke="var(--line)" stroke-width="0.5"/>';
  if(band!==null&&band!==undefined)o+='<rect x="'+(XS[band]-30)+'" y="'+(TOP-48)+'" width="60" height="'+(FH*N+48)+'" fill="var(--openbg)" opacity="0.55" rx="6"/>';
  var marks={5:[170],7:[170],10:[170],12:[110,230]};
  for(var m in marks){if(+m<=N){var cy=TOP+FH*(m-0.5);for(i=0;i<marks[m].length;i++)o+='<circle cx="'+marks[m][i]+'" cy="'+cy+'" r="5" fill="var(--line)"/>';}}
  for(i=1;i<=N;i++)o+='<line x1="52" x2="288" y1="'+(TOP+FH*i)+'" y2="'+(TOP+FH*i)+'" stroke="var(--line)" stroke-width="0.75"/>';
  o+='<line x1="52" x2="288" y1="'+TOP+'" y2="'+TOP+'" stroke="var(--muted)" stroke-width="3"/>';
  for(i=0;i<4;i++){
    o+='<line x1="'+XS[i]+'" x2="'+XS[i]+'" y1="'+TOP+'" y2="'+(TOP+FH*N)+'" stroke="var(--muted)" stroke-width="'+(1+0.4*(3-i))+'"/>';
    o+='<text x="'+XS[i]+'" y="11" text-anchor="middle" font-size="12" fill="var(--muted)">'+STR[i].n+'</text>';
  }
  for(i=1;i<=N;i++)o+='<text x="26" y="'+(TOP+FH*(i-0.5)+4)+'" text-anchor="middle" font-size="12" fill="var(--muted)">'+i+'</text>';
  for(i=0;i<dots.length;i++)o+=dotSvg(dots[i].s,dots[i].f,dots[i].c,dots[i].l);
  for(var s=0;s<4;s++)for(var f=0;f<=N;f++){
    var y=f===0?20:TOP+FH*(f-1),h=f===0?42:FH;
    o+='<rect class="hit" data-act="tap" data-s="'+s+'" data-f="'+f+'" x="'+(XS[s]-30)+'" y="'+y+'" width="60" height="'+h+'"/>';
  }
  return o+'</svg>';
}

function controls(){
  var o='<div class="ctl"><label>Bereich <select data-act="range">';
  [5,7,12].forEach(function(v){o+='<option value="'+v+'"'+(state.maxFret===v?' selected':'')+'>Bund 0–'+v+'</option>';});
  o+='</select></label><label><input type="checkbox" data-act="sharps"'+(state.sharps?' checked':'')+'> Halbtöne (#)</label>';
  o+='<label><input type="checkbox" data-act="sound"'+(state.sound?' checked':'')+'> Ton</label></div>';
  return o;
}

function viewMap(){
  var dots=[];
  for(var s=0;s<4;s++)for(var f=0;f<=state.maxFret;f++){
    var n=noteAt(s,f);
    if(!state.sharps&&!isNat(n))continue;
    dots.push({s:s,f:f,c:f===0?'open':(isNat(n)?'nat':'sharp'),l:NOTES[n]});
  }
  return controls()+'<div class="card"><p class="prompt">Griffbrett-Karte</p><p class="hint" style="margin:4px 0 0">Tippe auf eine Stelle, um den Ton zu hören. Zwischen E–F und H–C liegt nur ein Bund.</p></div>'+fretboard(dots);
}

function score(){
  return '<div class="score"><span>Serie <b>'+state.streak+'</b></span><span>Gesamt <b>'+stats.correct+'/'+stats.total+'</b></span></div>';
}

function viewFind(){
  if(!state.q)newQ();
  var q=state.q,dots=[],fb='',btn='',live='',mic=state.mic;
  if(q.done){
    if(q.ok){
      dots.push({s:q.picked.s,f:q.picked.f,c:'ok',l:NOTES[q.n]});
      fb='<p class="fb ok">Richtig!</p>';
    }else{
      var pre='',fr=[];
      if(q.picked){
        var pn=noteAt(q.picked.s,q.picked.f);
        dots.push({s:q.picked.s,f:q.picked.f,c:'bad',l:NOTES[pn]});
        pre='Das war '+NOTES[pn]+' auf der '+STR[q.picked.s].n+'-Saite. ';
      }
      for(var f=0;f<=state.maxFret;f++)if(noteAt(q.s,f)===q.n){dots.push({s:q.s,f:f,c:'ok',l:NOTES[q.n]});fr.push(f===0?'leer':f+'. Bund');}
      fb='<p class="fb bad">'+pre+NOTES[q.n]+' liegt auf der '+STR[q.s].n+'-Saite: '+fr.join(' / ')+'.</p>';
      btn='<p style="margin:8px 0 0"><button class="btn pri" data-act="next">Weiter</button></p>';
    }
  }else if(mic.on){
    live='<p class="fb">Ich höre: <b id="live">–</b> <span class="hint">· Ziel '+octName(STR[q.s].m+q.f)+'</span></p><div class="meter"><i id="mk"></i><span></span></div><p style="margin:10px 0 0"><button class="btn" data-act="skip">Überspringen</button></p>';
  }
  var m='<div class="ctl"><button class="btn'+(mic.on?' pri':'')+'" data-act="mic">Mit Ukulele spielen: '+(mic.on?'an':'aus')+'</button></div>';
  if(mic.err)m+='<div class="card"><p class="fb bad" style="margin:0">'+mic.err+'</p></div>';
  var title=(mic.on?'Spiele ':'Finde ')+NOTES[q.n]+' auf der '+STR[q.s].n+'-Saite';
  return controls()+m+score()+'<div class="card"><p class="prompt">'+title+'</p>'+(live||fb||'<p class="fb">&nbsp;</p>')+(live?'':btn)+'</div>'+fretboard(dots,q.s);
}

function viewName(){
  if(!state.q)newQ();
  var q=state.q,fb='',btn='',dots,i;
  if(q.done){
    dots=[{s:q.s,f:q.f,c:'ok',l:NOTES[q.n]}];
    if(q.ok)fb='<p class="fb ok">Richtig!</p>';
    else{fb='<p class="fb bad">Es ist '+NOTES[q.n]+', nicht '+NOTES[q.picked]+'.</p>';btn='<p style="margin:8px 0 0"><button class="btn pri" data-act="next">Weiter</button></p>';}
  }else dots=[{s:q.s,f:q.f,c:'q',l:'?'}];
  var list=[];for(i=0;i<12;i++)if(state.sharps||isNat(i))list.push(i);
  var a='<div class="ans">';
  list.forEach(function(n){
    var c='btn';
    if(q.done){if(n===q.n)c+=' ok';else if(!q.ok&&n===q.picked)c+=' bad';}
    a+='<button class="'+c+'" data-act="ans" data-n="'+n+'">'+NOTES[n]+'</button>';
  });
  a+='</div>';
  var where=q.f===0?'Leersaite':(q.f+'. Bund');
  return controls()+score()+'<div class="card"><p class="prompt">Welcher Ton? '+STR[q.s].n+'-Saite, '+where+'</p>'+(fb||'<p class="fb">&nbsp;</p>')+btn+'</div>'+a+fretboard(dots,null);
}

function viewStats(){
  var o='<div class="big"><div><small>Richtig gesamt</small><strong>'+stats.correct+' / '+stats.total+'</strong></div><div><small>Beste Serie</small><strong>'+stats.best+'</strong></div></div>';
  o+='<div class="card"><p class="prompt" style="font-size:17px">Trefferquote pro Ton</p>';
  var any=false;
  for(var n=0;n<12;n++){
    var st=stats.notes[n];
    if(!st){continue;}
    any=true;
    var pct=Math.round(100*st.c/st.a);
    o+='<div class="row"><span>'+NOTES[n]+'</span><div class="bar"><i style="width:'+pct+'%"></i></div><span>'+pct+'% ('+st.a+')</span></div>';
  }
  if(!any)o+='<p class="hint" style="margin:8px 0 0">Noch keine Antworten. Starte ein Quiz.</p>';
  o+='</div><p class="hint">Schwache Töne kommen im Quiz häufiger dran. Der Fortschritt wird nur in diesem Browser gespeichert.</p>';
  o+='<p><button class="btn" data-act="reset">'+(state.resetArmed?'Wirklich alles löschen?':'Statistik zurücksetzen')+'</button></p>';
  return o;
}

function render(){
  var tabs=[['map','Karte'],['find','Finden'],['name','Erkennen'],['stats','Statistik']];
  var o='<h1>Ukulele-Trainer</h1><p class="sub">Griffbrett lernen · GCEA</p><div class="tabs">';
  tabs.forEach(function(t){o+='<button class="tab'+(state.mode===t[0]?' on':'')+'" data-act="tab" data-v="'+t[0]+'">'+t[1]+'</button>';});
  o+='</div>';
  o+=state.mode==='map'?viewMap():state.mode==='find'?viewFind():state.mode==='name'?viewName():viewStats();
  document.getElementById('root').innerHTML=o;
}

function next(){newQ();state.mic.stable=0;state.mic.cool=Date.now()+1200;render();}

function handle(el){
  var act=el.getAttribute('data-act');
  if(act==='tab'){if(state.mic.on)stopMic();state.mode=el.getAttribute('data-v');state.q=null;state.resetArmed=false;render();}
  else if(act==='next'){next();}
  else if(act==='mic'){if(state.mic.on){stopMic();render();}else startMic();}
  else if(act==='skip'){
    var sq=state.q;
    if(sq&&!sq.done){sq.done=true;sq.ok=false;sq.picked=null;record(sq.n,false);render();}
  }
  else if(act==='reset'){
    if(state.resetArmed){stats={total:0,correct:0,best:0,notes:{}};state.streak=0;state.resetArmed=false;save();}
    else state.resetArmed=true;
    render();
  }
  else if(act==='tap'){
    var s=+el.getAttribute('data-s'),f=+el.getAttribute('data-f');
    play(s,f);
    if(state.mode==='find'&&state.q&&!state.q.done){
      var q=state.q;
      q.done=true;q.picked={s:s,f:f};
      q.ok=(s===q.s&&noteAt(s,f)===q.n);
      record(q.n,q.ok);
      render();
      if(q.ok){var id=q.id;setTimeout(function(){if(state.q&&state.q.id===id&&state.mode==='find')next();},900);}
    }
  }
  else if(act==='ans'){
    var qq=state.q;
    if(!qq||qq.done)return;
    var n=+el.getAttribute('data-n');
    play(qq.s,qq.f);
    qq.done=true;qq.picked=n;qq.ok=(n===qq.n);
    record(qq.n,qq.ok);
    render();
    if(qq.ok){var id2=qq.id;setTimeout(function(){if(state.q&&state.q.id===id2&&state.mode==='name')next();},900);}
  }
}
var root=document.getElementById('root');
root.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var a=el.getAttribute('data-act');
  if(a==='range'||a==='sharps'||a==='sound')return;
  handle(el);
});
root.addEventListener('change',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var a=el.getAttribute('data-act');
  if(a==='range'){state.maxFret=+el.value;state.q=null;state.last=null;render();}
  else if(a==='sharps'){state.sharps=el.checked;state.q=null;state.last=null;render();}
  else if(a==='sound'){state.sound=el.checked;}
});
render();
</script>
</body>
