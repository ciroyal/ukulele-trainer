// ----- Seitenaufbau: Gruppen (obere Leiste) mit Unterseiten -----
// modes: [Seite, Name, true = Übung]. Übungen erscheinen gesammelt hinter dem Reiter "Üben" in einer eigenen Reihe.
var GROUPS=[
  {id:'path',name:'Lernen',modes:[['path','Lernen']]},
  {id:'notes',name:'Töne',modes:[['map','Karte'],['tnotes','Theorie'],['find','Finden',true],['name','Erkennen',true]]},
  {id:'scales',name:'Tonleitern',modes:[['smap','Karte'],['tscales','Theorie'],['sfind','Finden',true],['sname','Erkennen',true],['splay','Ab Grundton',true],['splay2','Wechselton',true]]},
  {id:'chords',name:'Akkorde',modes:[['cmap','Karte'],['cdeg','Stufen'],['tchords','Theorie'],['cbuild','Bauen',true],['cstep','Stufe',true],['cfind','Greifen',true],['cname','Erkennen',true],['cplay','Spielen',true]]},
  {id:'tune',name:'Stimmen',hidden:true,modes:[['tune','Stimmen']]}, // Stimmgerät: Stimmgabel-Knopf oben rechts statt Reiter
  {id:'stats',name:'Statistik',modes:[['stats','Statistik']]}
];
var VIEWS={tnotes:viewTheoryNotes,tscales:viewTheoryScales,tchords:viewTheoryChords,path:viewPath,cdeg:viewChordDeg,cbuild:viewChordBuild,cstep:viewChordStep,map:viewMap,find:viewFind,name:viewName,cmap:viewChordMap,cfind:viewChordFind,cname:viewChordName,cplay:viewChordPlay,
  smap:viewScaleMap,sfind:viewScaleFind,sname:viewScaleName,splay:viewScalePlay,splay2:viewScalePlay,tune:viewTune,stats:viewStats};
function groupOf(mode){
  for(var i=0;i<GROUPS.length;i++)for(var j=0;j<GROUPS[i].modes.length;j++)if(GROUPS[i].modes[j][0]===mode)return GROUPS[i];
  return GROUPS[0];
}
function render(){
  var g=groupOf(state.mode);
  if(state.round&&state.round.mode!==state.mode)cancelRound();
  // Spracherkennung läuft nur in Übungen mit Antwortknöpfen
  if(voice.on&&VOICE_MODES.indexOf(state.mode)>=0)voiceStart();else voiceStop();
  // Kopfzeile: Titel links, Einstellungen (Instrument wählen) oben rechts
  var fork='<svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 3v8a4 4 0 0 0 8 0V3"/><path d="M12 15v6"/></svg>';
  var o='<div class="head"><div class="ttl"><h1>'+INSTR[state.inst].name+'</h1><div class="tun"><small>Stimmung</small>'+INSTR[state.inst].tuning+'</div></div><div class="tools">'+
    '<button class="ibtn fork'+(state.mode==='tune'?' on':'')+'" data-act="grp" data-v="tune" aria-label="Stimmgerät" title="Stimmgerät">'+fork+'</button>'+
    '<button class="ibtn gear'+(state.settings?' on':'')+'" data-act="settings" aria-label="Einstellungen" aria-expanded="'+(state.settings?'true':'false')+'">⚙</button></div></div>';
  if(state.settings){
    o+='<div class="card"><p class="prompt" style="font-size:17px">Einstellungen</p><p class="hint" style="margin:4px 0 8px">Instrument</p><div class="inst" style="margin:0">';
    Object.keys(INSTR).forEach(function(k){o+='<button class="btn'+(state.inst===k?' on':'')+'" data-act="inst" data-v="'+k+'">'+INSTR[k].name+'</button>';});
    o+='</div><p class="hint" style="margin:12px 0 8px">Tonnamen</p><div class="inst" style="margin:0"><button class="btn'+(INTL?'':' on')+'" data-act="naming" data-v="de">Deutsch (H, Cis)</button><button class="btn'+(INTL?' on':'')+'" data-act="naming" data-v="int">International (B, C♯)</button></div><p class="hint" style="margin:12px 0 4px">Ton</p><label class="ctl" style="margin:0;color:var(--text)"><input type="checkbox" data-act="sound"'+(state.sound?' checked':'')+'> Töne beim Antippen und Anhören abspielen</label><p class="hint" style="margin:12px 0 4px">Bildschirm</p><label class="ctl" style="margin:0;color:var(--text)"><input type="checkbox" data-act="awake"'+(state.awake?' checked':'')+(navigator.wakeLock?'':' disabled')+'> Anlassen, solange die App offen ist</label>'+(navigator.wakeLock?'':'<p class="hint" style="margin:4px 0 0">Dieser Browser unterstützt das nicht.</p>')+'<p class="hint" style="margin:12px 0 0">Version '+VERSION+'</p></div>';
  }
  var shown=GROUPS.filter(function(x){return !x.hidden;});
  o+='<div class="tabs top" style="grid-template-columns:repeat('+shown.length+',1fr)">';
  shown.forEach(function(x){o+='<button class="tab'+(x===g?' on':'')+'" data-act="grp" data-v="'+x.id+'">'+x.name+'</button>';});
  o+='</div>';
  var base=g.modes.filter(function(m){return !m[2];}),ex=g.modes.filter(function(m){return m[2];});
  if(g.modes.length>1){
    var inEx=ex.some(function(m){return m[0]===state.mode;}),n=base.length+(ex.length?1:0);
    o+='<div class="tabs sub" style="grid-template-columns:repeat('+n+',1fr)">';
    base.forEach(function(m){o+='<button class="tab'+(state.mode===m[0]?' on':'')+'" data-act="tab" data-v="'+m[0]+'">'+m[1]+'</button>';});
    if(ex.length)o+='<button class="tab'+(inEx?' on':'')+'" data-act="tab" data-practice="1" data-v="'+(state.gx[g.id]||ex[0][0])+'">Üben</button>';
    o+='</div>';
    if(inEx){
      o+='<div class="tabs sub ex" style="grid-template-columns:repeat('+ex.length+',1fr)">';
      ex.forEach(function(m){o+='<button class="tab'+(state.mode===m[0]?' on':'')+'" data-act="tab" data-v="'+m[0]+'">'+m[1]+'</button>';});
      o+='</div>'+roundBar();
      if(VOICE_MODES.indexOf(state.mode)>=0)o+=voiceBar();
    }
  }
  markSeen(state.mode);
  o+=VIEWS[state.mode]()+guideBar();
  document.getElementById('root').className=state.round?'inround':'';
  document.getElementById('root').innerHTML=o;
  if(voice.stream)voiceMakeRec(); // Vokabular an die sichtbaren Antworten anpassen
}

// Springt nach einer richtigen Antwort zur nächsten Frage, außer der Nutzer hat inzwischen selbst weitergeschaltet oder den Tab gewechselt.
function autoAdvance(q,mode,ms){
  var id=q.id;
  setTimeout(function(){if(state.q&&state.q.id===id&&state.mode===mode)next();},ms);
}
function next(){newForMode();state.mic.stable=0;state.mic.cool=Date.now()+1200;render();}

function handle(el){
  var act=el.getAttribute('data-act'),v=el.getAttribute('data-v');
  var q=state.q,I=INSTR[state.inst];
  if(act==='tab'||act==='grp'){
    if(state.mic.on)stopMic();
    var mode=act==='tab'?v:(state.gm[v]||GROUPS.filter(function(x){return x.id===v;})[0].modes[0][0]); // Gruppe: zuletzt benutzte Unterseite
    state.mode=mode;state.settings=false;state.gm[groupOf(mode).id]=mode;
    if(groupOf(mode).modes.some(function(m){return m[0]===mode&&m[2];}))state.gx[groupOf(mode).id]=mode; // zuletzt benutzte Übung der Gruppe
    state.q=null;state.resetArmed=false;render();
  }
  else if(act==='next'){next();}
  else if(act==='voice'){voice.on=!voice.on;voice.err='';voice.heard='';voice.retried=false;render();}
  else if(act==='stepreset'){
    // TEMPORÄR zum Testen: Fortschritt eines Schritts im Lernweg löschen (die Trefferquoten in der Statistik bleiben)
    PATH.forEach(function(st){
      if(st[0]!==+v)return;
      if(stats.seen)delete stats.seen[st[1]];
      if(stats.rounds)delete stats.rounds[st[1]];
      if(stats.levels)delete stats.levels[st[1]];
      delete state.lv[st[1]];
    });
    state.roundResult=null;state.levelUp=null;save();render();
  }
  else if(act==='rstart'){startRound();}
  else if(act==='rstop'){cancelRound();state.roundResult=null;render();}
  else if(act==='settings'){state.settings=!state.settings;render();}
  else if(act==='naming'){try{localStorage.setItem('griffbrett-naming',v);}catch(e){/* Speicher gesperrt */}location.reload();}
  else if(act==='inst'){useInstrument(v);state.settings=false;render();}
  else if(act==='tstr'){
    state.tune.sel=v;
    if(v!=='auto'&&!state.mic.on)play(+v,0);
    render();
  }
  else if(act==='micretry'){startMic();}
  else if(act==='mic'){if(state.mic.on){stopMic();render();}else startMic();}
  else if(act==='skip'){
    if(q&&!q.done){
      q.done=true;q.ok=false;q.picked=null;
      if(isSP(state.mode))record(SCALES[q.t].id,false,'scales');
      else if(state.mode==='cplay')record(I.chords[q.i].n,false,'chords');
      else record(q.n,false);
      render();
    }
  }
  else if(act==='reset'){
    if(state.resetArmed){stats={total:0,correct:0,best:0,notes:{}};state.streak=0;state.resetArmed=false;save();}
    else state.resetArmed=true;
    render();
  }
  else if(act==='csel'){state.cSel=+v;render();}
  else if(act==='dsel'){state.dSel=+v;render();}
  else if(act==='bsel'){
    if(!q||q.done)return;
    var bn=+el.getAttribute('data-n'),bi=q.sel.indexOf(bn);
    if(bi>=0)q.sel.splice(bi,1);else q.sel.push(bn);
    render();
  }
  else if(act==='bchk'){
    if(!q||q.done||!q.sel.length)return;
    q.done=true;q.ok=q.sel.slice().sort().join()===q.tri.notes.slice().sort().join();
    record(degKey(q.t,q.tri),q.ok,'degrees');render();
    if(q.ok)autoAdvance(q,'cbuild',1500);
  }
  else if(act==='dans'){
    if(!q||q.done)return;
    q.done=true;q.picked=+v;q.ok=(+v===q.d);
    record(degKey(q.t,q.tri),q.ok,'degrees');render();
    if(q.ok)autoAdvance(q,'cstep',1200);
  }
  else if(act==='more'){state.moreOpen=!state.moreOpen;render();}
  else if(act==='strum'){
    var c=I.chords[Math.min(state.cSel,I.chords.length-1)];
    playSeq(c.f.map(function(f,s){return f<0?null:STR[s].f*Math.pow(2,f/12);}),90);
  }
  else if(act==='splayall'){playSeq(scaleFreqs(state.sRoot,SCALES[state.sType]),380);}
  else if(act==='cchk'){
    if(!q||q.done)return;
    var ch=I.chords[q.i];
    q.done=true;q.ok=ch.f.every(function(f,i){return f===q.fing[i];});
    record(ch.n,q.ok,'chords');render();
    if(q.ok)autoAdvance(q,'cfind',1200);
  }
  else if(act==='cans'){
    if(!q||q.done)return;
    q.done=true;q.picked=+v;q.ok=(+v===q.i);
    record(I.chords[q.i].n,q.ok,'chords');render();
    if(q.ok)autoAdvance(q,'cname',900);
  }
  else if(act==='sans'){
    if(!q||q.done)return;
    var sc=SCALES[q.t],n=+el.getAttribute('data-n');
    q.done=true;q.picked=n;q.ok=(n===q.k);
    record(sc.id,q.ok,'scales');render();
    if(q.ok)autoAdvance(q,'sname',900);
  }
  else if(act==='sgive'){
    if(!q||q.done)return;
    q.done=true;q.ok=false;q.gaveUp=true;
    record(SCALES[q.t].id,false,'scales');render();
  }
  else if(act==='tap'){
    var s=+el.getAttribute('data-s'),f=+el.getAttribute('data-f'),m=state.mode;
    if(m==='cfind'&&q&&!q.done){
      // Griff bauen: oben (Bund 0) dämpfen, sonst Finger setzen oder wieder wegnehmen
      if(f===0){if(I.mutes)q.fing[s]=q.fing[s]===-1?0:-1;}
      else{q.fing[s]=q.fing[s]===f?0:f;play(s,f);}
      render();
    }
    else if(m==='sfind'&&q&&!q.done){
      play(s,f);
      var key=s+':'+f,inRound=state.round&&state.round.mode===m;
      if(q.found.indexOf(key)<0){
        if(q.targets.indexOf(key)>=0){
          q.found.push(key);q.bad=null;
          if(inRound){state.round.ok++;state.round.total++;} // in der Runde zählt jeder gefundene Ton
          if(q.found.length===q.targets.length){
            q.done=true;q.ok=(q.miss===0);
            record(SCALES[q.t].id,q.ok,'scales');render();
            if(q.ok)autoAdvance(q,'sfind',1200);
            return;
          }
        }else{q.miss++;q.bad=key;if(inRound)state.round.total++;}
      }
      render();
    }
    else{
      play(s,f);
      if(m==='find'&&q&&!q.done){
        q.done=true;q.picked={s:s,f:f};
        q.ok=(s===q.s&&noteAt(s,f)===q.n);
        record(q.n,q.ok);
        render();
        if(q.ok)autoAdvance(q,'find',900);
      }
    }
  }
  else if(act==='ans'){
    if(!q||q.done)return;
    var nn=+el.getAttribute('data-n');
    play(q.s,q.f);
    q.done=true;q.picked=nn;q.ok=(nn===q.n);
    record(q.n,q.ok);
    render();
    if(q.ok)autoAdvance(q,'name',900);
  }
}
var root=document.getElementById('root');
// Bildschirm anlassen (Wake Lock): Der Browser gibt die Sperre frei, sobald die Seite in den Hintergrund geht,
// deshalb wird sie bei jeder Rückkehr und beim ersten Tippen neu angefordert.
var wakeLock=null;
function keepAwake(){
  if(!navigator.wakeLock)return;
  if(!state.awake){if(wakeLock){wakeLock.release().catch(function(){/* war schon frei */});wakeLock=null;}return;}
  if(wakeLock||document.visibilityState!=='visible')return;
  navigator.wakeLock.request('screen').then(function(l){
    wakeLock=l;l.addEventListener('release',function(){wakeLock=null;});
    if(!state.awake){l.release();}
  }).catch(function(){/* Browser lehnt ab (z. B. Energiesparmodus): Bildschirm folgt der Geräte-Einstellung */});
}
document.addEventListener('visibilitychange',keepAwake);
root.addEventListener('click',keepAwake);
root.addEventListener('click',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var a=el.getAttribute('data-act');
  if(a==='range'||a==='sharps'||a==='sound'||a==='awake'||a==='sroot'||a==='stype'||a==='proot'||a==='ptype'||a==='kroot'||a==='ktype'||a==='slevel'||a==='mpos'||a==='fpos')return; // diese laufen über das change-Ereignis
  handle(el);
});
root.addEventListener('change',function(e){
  var el=e.target.closest('[data-act]');
  if(!el)return;
  var a=el.getAttribute('data-act');
  if(a==='range'){state.maxFret=+el.value;state.q=null;state.last=null;render();}
  else if(a==='sharps'){state.sharps=el.checked;state.q=null;state.last=null;render();}
  else if(a==='awake'){state.awake=el.checked;try{localStorage.setItem('griffbrett-awake',el.checked?'1':'0');}catch(e){/* Speicher gesperrt: gilt nur bis zum Neuladen */}keepAwake();render();}
  else if(a==='sound'){state.sound=el.checked;try{localStorage.setItem('griffbrett-sound',el.checked?'1':'0');}catch(e){/* Speicher gesperrt: gilt nur bis zum Neuladen */}}
  else if(a==='slevel'){state.lv[state.mode]=+el.value;state.q=null;cancelRound();state.roundResult=null;render();}
  else if(a==='mpos'){state.mPos=+el.value;render();}
  else if(a==='fpos'){state.fPos=+el.value;state.q=null;render();}
  else if(a==='sroot'){state.sRoot=+el.value;render();}
  else if(a==='stype'){state.sType=+el.value;render();}
  else if(a==='kroot'){state.kRoot=+el.value;state.q=null;savePick();render();}
  else if(a==='ktype'){state.kType=+el.value;state.q=null;savePick();render();}
  else if(a==='proot'){state.pRoot=+el.value;state.q=null;savePick();render();}
  else if(a==='ptype'){state.pType=+el.value;state.q=null;savePick();render();}
});
// Gewählte Übungs-Tonleiter merken (gilt für beide Instrumente)
function savePick(){
  try{localStorage.setItem('griffbrett-pick',[state.pRoot,state.pType,state.kRoot,state.kType].join(','));}catch(e){/* Speicher gesperrt: Auswahl gilt nur bis zum Neuladen */}
}
(function(){
  try{
    var pk=(localStorage.getItem('griffbrett-pick')||'').split(',').map(Number);
    if(pk.length>=2&&pk[0]>=-2&&pk[0]<12&&pk[1]>=-1&&pk[1]<SCALES.length&&pk[0]%1===0&&pk[1]%1===0){state.pRoot=pk[0];state.pType=pk[1];}
    if(pk.length===4&&pk[2]>=-1&&pk[2]<12&&pk[3]>=0&&pk[3]<=1&&pk[2]%1===0&&pk[3]%1===0){state.kRoot=pk[2];state.kType=pk[3];}
  }catch(e){/* Speicher gesperrt oder Wert kaputt: zufällig */}
  try{if(localStorage.getItem('griffbrett-sound')==='0')state.sound=false;}catch(e){/* Speicher gesperrt: Ton bleibt an */}
  try{if(localStorage.getItem('griffbrett-awake')==='0')state.awake=false;}catch(e){/* Speicher gesperrt: Bildschirm bleibt an */}
  var saved=null;
  try{saved=localStorage.getItem('griffbrett-inst');}catch(e){/* Speicher gesperrt: mit Ukulele starten */}
  useInstrument(INSTR[saved]?saved:'uke');
})();
render();
keepAwake();
</script>
